models:
- name: stg_local_bike__customers
  description: This model serves as a staging layer for customer data from the local
    bike source. It standardizes and prepares customer information for downstream
    analysis and reporting.
  columns:
  - name: customer_id
    description: A unique identifier for each customer.
    data_tests:
      - unique
      - not_null
  - name: first_name
    description: The first name of the customer.
    data_tests:
      - not_null
  - name: last_name
    description: The last name of the customer.
    data_tests:
      - not_null
  - name: phone
    description: The phone number of the customer.
  - name: email
    description: The email address of the customer.
  - name: street
    description: The street address of the customer.
  - name: city
    description: The city where the customer resides.
  - name: state
    description: The state where the customer resides.
  - name: zip_code
    description: The postal code for the customer's address.