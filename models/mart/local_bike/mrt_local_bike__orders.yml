models:
- name: mrt_local_bike__orders
  description: This model aggregates order data from the local bike store, providing
    a comprehensive view of each order including customer, store, and staff details,
    as well as order status and timing. It calculates the total price, total items,
    and total distinct items for each order, which can be used for sales analysis
    and inventory management.
  columns:
  - name: order_id
    description: A unique identifier for each order.
  - name: customer_id
    description: The identifier for the customer who placed the order.
  - name: store_id
    description: The identifier for the store where the order was placed.
  - name: staff_id
    description: The identifier for the staff member who handled the order.
  - name: order_status
    description: The current status of the order, such as pending, shipped, or completed.
  - name: order_created_at
    description: The date when the order was created.
  - name: order_required_at
    description: The date by which the order is required to be fulfilled.
  - name: order_shipped_at
    description: The date when the order was shipped.
  - name: total_order_price
    description: The total price of all items in the order.
  - name: total_items
    description: The total number of items in the order.
  - name: total_distinct_items
    description: The total number of distinct items in the order.
